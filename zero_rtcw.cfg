set devdll 1

//Tastenbefehle

bind # "vsay_team negative"
bind + "vsay GoodGame"
bind ? "vsay EnemyWeak"
bind , "+leanleft"
bind . "+leanright"
bind * "-"
bind - "+reload"

bind 0 "vsay_team LetsGo"
bind 1 "vsay_team IamEngineer"
bind 2 "vsay_team IamLieutenant"
bind 3 "vsay_team IamMedic"
bind 4 "vsay_team IamSoldier"
bind 5 "vsay DisarmDynamite"
bind 6 "vsay DynamitePlanted"
bind 7 "vsay DynamiteDefused"
bind 8 "vsay_team FireInTheHole"
bind 9 "vsay_team AllClear"

bind b "vsay_team move"
bind c "vsay_team affirmative"

bind e "ready"
bind f "vsay affirmative"
bind g "vsay_team coverme"
bind h "vsay_team incoming"
bind i "pause"
bind j "vote yes"
bind k "vsay_team Onmyway"
bind l "vsay GreatShot"
bind m "OpenLimboMenu"
bind n "vote no"
bind o "unpause"
bind p "+dropweapon"
bind q "readyteam"
bind r ";+dropweapon;-dropweapon;+activate;-activate"  //RtCW 1.0 Dropreload für Hauptwaffe

bind t "messagemode"
bind u "vsay_team OnDefense"
bind v "mp_QuickMessage"

bind x "vsay_team FollowMe"
bind y "messagemode2"
bind z "screenshotJPEG"

bind w "+forward"
bind s "+back"
bind a "+moveleft"
bind d "+moveright"

bind ALT "-"
bind CTRL "+movedown"
bind SHIFT "+sprint"
bind INS "vstr nametg"
bind DEL "+zoom"
bind PGDN "vstr weap"
bind PGUP "vstr charactog"
bind HOME "vstr OK"
bind END "weapalt"
bind TAB "seta cg_drawGun 1;weaponbank 2"
bind ENTER "+activate"
bind ESCAPE "togglemenu"

bind F1 "vsay_team needengineer"
bind F2 "vsay_team needammo"
bind F3 "vsay_team medic"
bind F4 "+scores"
bind F5 "vsay hi"
bind F6 "vsay oops"
bind F7 "vsay bye"
bind F8 "vsay cheer"
bind F9 "vsay_team sorry"
bind F10 "vsay_team thanks"
bind F11 "vsay_team welcome"
bind F12 "vsay_team defendobjective"

bind KP_HOME "-"
bind KP_SLASH "-"
bind KP_5 "seta cg_drawGun 1;weaponbank 4"
bind KP_END "+movedown"
bind KP_UPARROW "-"
bind KP_LEFTARROW "seta cg_drawGun 0;weaponbank 3"
bind KP_RIGHTARROW "seta cg_drawGun 1;weaponbank 5"
bind KP_DOWNARROW "seta cg_drawGun 1;weaponbank 2"
bind KP_PGUP "-"
bind KP_PGDN "kill"
bind KP_ENTER "vstr spawntoggle"
bind KP_INS "seta cg_drawGun 1;weaponbank 6"
bind KP_DEL "seta cg_drawGun 1;weaponbank 1"

bind MOUSE1 "+attack"
bind MOUSE2 "+moveup"
bind MOUSE3 "+reload"
bind MWHEELDOWN "seta cg_drawGun 1;weapnext"
bind MWHEELUP "seta cg_drawGun 1;weapprev"

//Auto-Spawn mit Tatse KP_Enter

set spawnauto "setspawnpt 0;echo ^5Spawn Point: ^1AUTO;set spawntoggle vstr spawnaxis" 
set spawnaxis "setspawnpt 1;echo ^5Spawn Point: ^1AXIS;set spawntoggle vstr spawnallied" 
set spawnallied "setspawnpt 2;echo ^5Spawn Point: ^1ALLIED;set spawntoggle vstr spawnauto"
set spawntoggle "vstr spawnauto" 

//Spawn Axisbarracks mit Taste BACKSPACE

bind BACKSPACE "vstr spawn_barracks; setspawnpt 3; echo ^3Sp-B ^4Barracks spawn side; say_team ^2- ^0S^9pa^:wn ^2- ^0Bar^9ra^:cks ^2-"

//Spawn Sniperhill mit Taste KP_MINUS

bind KP_MINUS "vstr spawn_sniper; setspawnpt 100; echo ^3Sp-S ^4Sniper spawn side; say_team ^2- ^0S^9pa^:wn ^2- ^0Sn^9ip^:er ^2-"

